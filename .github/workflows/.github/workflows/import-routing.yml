name: Import approved routing source batch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack scoped source batch
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find _incoming -name '*routing-batch.zip' -print -quit)
          test -n "$archive"
          python3 - "$archive" <<'PY'
          import sys,zipfile,pathlib
          with zipfile.ZipFile(sys.argv[1]) as z:
            for n in z.namelist():
              p=pathlib.PurePosixPath(n)
              if p.is_absolute() or '..' in p.parts or n.startswith('.github/') or n.startswith('.git/'): raise SystemExit('Unsafe entry')
            z.extractall('.')
          PY
          rm -r _incoming
          git config user.name 'Mohamed Elnaggar'
          git config user.email 'MohamedElnaggar00@users.noreply.github.com'
          git add .
          git commit -m 'Add automatic Windows TCP routing, tray menu and family UI'
          git push
