name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Verified Windows build run id
        required: true
      sha:
        description: Commit the build was made from
        required: true
      tag:
        description: Release tag
        required: true
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: Fluent-TLS-Tunnel-preview
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: verified-build
      - name: Publish verified Windows packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.run_id }} --jq .head_sha)" = "${{ inputs.sha }}"
          test "$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${{ inputs.run_id }} --jq .conclusion)" = "success"
          test -f verified-build/routing-passed.txt
          test "${{ inputs.tag }}" = "v0.1.7"
          gh release view "${{ inputs.tag }}" --json isDraft --jq .isDraft | grep -qx true
          gh release upload "${{ inputs.tag }}" verified-build/packages/Fluent-TLS-Tunnel-installer.exe verified-build/packages/Fluent-TLS-Tunnel-portable.zip verified-build/packages/Fluent-TLS-Tunnel-runtime-dependent.exe
