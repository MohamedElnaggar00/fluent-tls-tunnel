name: Windows build, core tests and UI previews
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test TLS, SNI and validation
        run: dotnet run --project CoreTests.csproj -c Release
      - name: Audit dependencies
        run: dotnet list TunnelCore.csproj package --vulnerable --include-transitive
      - name: Publish framework-dependent app
        run: dotnet publish FluentTlsTunnel.csproj -c Release -r win-x64 --self-contained false -p:WindowsAppSDKSelfContained=true -o artifacts/dependent
      - name: Publish portable app
        run: dotnet publish FluentTlsTunnel.csproj -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -o artifacts/portable
      - name: Include license notices
        shell: pwsh
        run: |
          Copy-Item LICENSE,THIRD-PARTY-NOTICES.txt artifacts/dependent
          Copy-Item LICENSE,THIRD-PARTY-NOTICES.txt artifacts/portable
      - name: Build three preview packages
        shell: pwsh
        run: |
          New-Item artifacts/packages -ItemType Directory -Force | Out-Null
          Compress-Archive artifacts/portable/* artifacts/packages/Fluent-TLS-Tunnel-portable.zip
          $iscc='C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if(!(Test-Path $iscc)) {throw 'Inno Setup compiler is unavailable'}
          & $iscc /DSourceDir=artifacts/portable /DFlavor=installer Installer.iss
          if($LASTEXITCODE -ne 0) {throw 'Bundled installer compile failed'}
          & $iscc /DSourceDir=artifacts/dependent /DFlavor=runtime-dependent /DDependent Installer.iss
          if($LASTEXITCODE -ne 0) {throw 'Dependent installer compile failed'}
      - name: Capture UI previews
        shell: powershell
        run: ./Capture.ps1
      - name: Smoke test bundled install and uninstall
        shell: pwsh
        run: |
          $dir=Join-Path $env:TEMP 'FluentTlsTunnelSmoke'
          $install=Start-Process artifacts/packages/Fluent-TLS-Tunnel-installer.exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$dir") -Wait -PassThru
          if($install.ExitCode -ne 0) {throw "Installer failed: $($install.ExitCode)"}
          if(!(Test-Path "$dir/FluentTlsTunnel.exe") -or !(Test-Path "$dir/1-AppIcon.ico")) {throw 'Installed app files are missing'}
          $app=Start-Process "$dir/FluentTlsTunnel.exe" -ArgumentList '--preview=en --state=about' -PassThru
          for($i=0;$i -lt 30;$i++) {Start-Sleep -Milliseconds 500; $app.Refresh(); if($app.MainWindowHandle -ne [IntPtr]::Zero) {break}; if($app.HasExited) {throw 'Installed app exited before its window opened'}}
          if($app.MainWindowHandle -eq [IntPtr]::Zero) {throw 'Installed app did not open a window'}
          $app.CloseMainWindow() | Out-Null
          if(!$app.WaitForExit(15000)) {$app.Kill(); throw 'Normal app shutdown did not complete'}
          $uninstall=Start-Process "$dir/unins000.exe" -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if($uninstall.ExitCode -ne 0) {throw 'Uninstall failed'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fluent-TLS-Tunnel-preview
          path: artifacts/
