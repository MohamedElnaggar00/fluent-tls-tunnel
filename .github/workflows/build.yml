name: Windows build, core tests and UI previews
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Materialize source files
        shell: pwsh
        run: |
          $files=[Text.Encoding]::UTF8.GetString([Convert]::FromBase64String('')) | ConvertFrom-Json -AsHashtable
          foreach($name in $files.Keys) { [IO.File]::WriteAllText((Join-Path (Get-Location) $name),$files[$name],[Text.UTF8Encoding]::new($false)) }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- App.xaml App.xaml.cs MainWindow.xaml MainWindow.xaml.cs FluentTlsTunnel.csproj DnsManager.cs ConfigCrypto.cs TunnelCore.cs TunnelCore.csproj CoreTests.cs CoreTests.csproj Directory.Build.props Capture.ps1 app.manifest README.md LICENSE THIRD-PARTY-NOTICES.txt .gitignore
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0) {git commit -m "Add Fluent TLS Tunnel application source"; git push}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test TLS, SNI and validation
        run: dotnet run --project CoreTests.csproj -c Release
      - name: Audit dependencies
        run: dotnet list TunnelCore.csproj package --vulnerable --include-transitive
      - name: Publish framework-dependent app
        run: dotnet publish FluentTlsTunnel.csproj -c Release -r win-x64 --self-contained false -p:WindowsAppSDKSelfContained=true -o artifacts/dependent
      - name: Publish portable app
        run: dotnet publish FluentTlsTunnel.csproj -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -o artifacts/portable
      - name: Include license notices
        shell: pwsh
        run: |
          Copy-Item LICENSE,THIRD-PARTY-NOTICES.txt artifacts/dependent
          Copy-Item LICENSE,THIRD-PARTY-NOTICES.txt artifacts/portable
      - name: Capture UI previews
        shell: powershell
        run: ./Capture.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fluent-TLS-Tunnel-preview
          path: artifacts/
