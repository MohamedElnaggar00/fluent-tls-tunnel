name: Windows build, core tests and UI previews
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test TLS, SNI and validation
        run: dotnet run --project CoreTests.csproj -c Release
      - name: Audit dependencies
        run: dotnet list TunnelCore.csproj package --vulnerable --include-transitive
      - name: Publish framework-dependent app
        run: dotnet publish FluentTlsTunnel.csproj -c Release -r win-x64 --self-contained false -p:WindowsAppSDKSelfContained=true -o artifacts/dependent
      - name: Publish portable app
        run: dotnet publish FluentTlsTunnel.csproj -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -o artifacts/portable
      - name: Include license notices
        shell: pwsh
        run: |
          Copy-Item LICENSE,THIRD-PARTY-NOTICES.txt artifacts/dependent
          Copy-Item LICENSE,THIRD-PARTY-NOTICES.txt artifacts/portable
      - name: Capture UI previews
        shell: powershell
        run: ./Capture.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fluent-TLS-Tunnel-preview
          path: artifacts/
